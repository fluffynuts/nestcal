name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The single source of the version string: a push to master is a stable release,
  # everything else (other branches, PRs, manual runs) is a -beta pre-release.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      stable: ${{ steps.compute.outputs.stable }}
    steps:
      - uses: actions/checkout@v4

      - id: compute
        run: |
          version="$(tr -d '[:space:]' < VERSION).${GITHUB_RUN_NUMBER}"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/master ]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            version="${version}-beta"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version: ${version}"

  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements-test.txt

      - run: python -m pytest

  build:
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            artifact: nestcal-macos-arm64
          - runner: macos-15-intel
            artifact: nestcal-macos-amd64
          # oldest available Ubuntu: a binary only runs on the glibc it was built against or newer
          - runner: ubuntu-22.04
            artifact: nestcal-linux-amd64
          - runner: windows-latest
            artifact: nestcal-windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installed before the build so PyInstaller bundles them, rather than
      # leaving the app depending on whatever the user's machine has.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libfreetype6 libx11-6 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1

      - run: python -m pip install -r requirements-build.txt

      # Same string as the tag the release job publishes, so the app knows its own version.
      - name: Stamp the version into the build
        shell: bash
        run: echo "VERSION = \"${{ needs.version.outputs.version }}\"" > nestcal_version.py

      - run: pyinstaller --noconfirm nestcal.spec

      - name: Check the executable matches the runner architecture
        if: runner.os == 'macOS'
        run: |
          expected="$([ "$(uname -m)" = arm64 ] && echo arm64 || echo x86_64)"
          actual="$(lipo -archs dist/Nestcal.app/Contents/MacOS/Nestcal)"
          echo "built for: $actual"
          [ "$actual" = "$expected" ]

      # With no feeds configured the app exits 1 with a known message, which
      # proves every bundled import loads without needing a display or a calendar.
      - name: Smoke test the bundled app
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then exe=dist/Nestcal.app/Contents/MacOS/Nestcal; else exe=dist/nestcal/Nestcal; fi
          output="$(HOME="$(mktemp -d)" QT_QPA_PLATFORM=offscreen "$exe" 2>&1 || true)"
          echo "$output"
          echo "$output" | grep -q "no feeds configured"

      # The windowed exe has no stdout, so the message can't be read. Exit code 1
      # plus the config stub having been written is the weaker equivalent.
      - name: Smoke test the bundled app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fakeHome = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "nestcal-home")
          $env:USERPROFILE = $fakeHome.FullName
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath dist\nestcal\Nestcal.exe -Wait -PassThru
          Write-Host "exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 1) { exit 1 }
          if (-not (Test-Path (Join-Path $fakeHome.FullName ".config\nestcal.ini"))) { exit 1 }

      # ditto/tar keep the permissions and symlinks that upload-artifact's zip drops.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Nestcal.app "${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.artifact }}.tar.gz" -C dist nestcal

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\nestcal -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  # Every push publishes a release. master's is the "latest" one, with fixed asset names
  # so releases/latest/download/<name> links stay valid; other branches' are -beta pre-releases.
  release:
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_STRING: ${{ needs.version.outputs.version }}
      STABLE: ${{ needs.version.outputs.stable }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather and verify packages
        run: |
          mkdir release
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          [ "$(ls release | wc -l)" -eq 4 ]
          for package in release/*.zip; do unzip -tq "$package"; done
          for package in release/*.tar.gz; do tar -tzf "$package" > /dev/null; done
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Publish release
        run: |
          version="$VERSION_STRING"
          tag="v${version}"

          if pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[0] | select(. != null) | "### \(.title) (#\(.number))\n\n\(.body // "")"')"; then
            echo "$pr" > notes.md
          else
            echo "::warning::could not look up the pull request for ${GITHUB_SHA}; releasing without its description"
            : > notes.md
          fi

          if [ "$STABLE" = true ]; then
            release_flags=(--latest)
          else
            release_flags=(--prerelease)
            printf '\n**Pre-release build from branch `%s`.**\n' "$GITHUB_REF_NAME" >> notes.md
          fi

          cat >> notes.md <<EOF

          **Work in progress.** Please report what you find.

          ### Downloads

          | Platform | File |
          | --- | --- |
          | macOS (Apple Silicon) | \`nestcal-macos-arm64.zip\` |
          | macOS (Intel) | \`nestcal-macos-amd64.zip\` |
          | Linux (x86-64) | \`nestcal-linux-amd64.tar.gz\` |
          | Windows (x86-64) | \`nestcal-windows-amd64.zip\` |

          \`SHA256SUMS\` has the checksum of each file.

          Create \`~/.config/nestcal.ini\` before the first launch; see the README.

          The apps are unsigned. On macOS, run \`xattr -cr Nestcal.app\` once (or right-click and choose Open);
          on Windows, SmartScreen will warn on first run.
          EOF

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" \
              --title "nestcal ${version}" --notes-file notes.md --generate-notes "${release_flags[@]}"
          fi
